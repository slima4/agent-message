site_name: agent-message
site_description: >-
  Cross-tool messaging between AI coding agents — Claude Code, Codex CLI, Cursor,
  Copilot, Aider. File-based: no server, no MCP, no daemon, no token. Reference
  implementation of SAMP (Simple Agent Message Protocol).
site_url: https://slima4.github.io/agent-message/
repo_url: https://github.com/slima4/agent-message
repo_name: slima4/agent-message
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/message-fast-outline
  palette:
    - scheme: default
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/weather-night
        name: Light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/slima4/agent-message
      name: agent-message on GitHub

nav:
  - Home: index.md
  - Install: install.md
  - Use: use.md
  - Integrations:
    - Overview: integrations/index.md
    - Cursor: integrations/cursor.md
    - GitHub Copilot Chat: integrations/copilot.md
    - GitHub Copilot CLI: integrations/copilot-cli.md
    - Google Antigravity: integrations/antigravity.md
    - OpenAI Codex CLI: integrations/codex.md
    - Zed: integrations/zed.md
    - opencode: integrations/opencode.md
    - Continue.dev: integrations/continue.md
    - Aider: integrations/aider.md
  - SAMP Spec: spec.md
  - Implementations: implementations.md
  - Design: design.md
  - Limits: limits.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
